# adbm smoke test: system Settings → Display → frame.
# The text regex covers English and Russian emulator locales.
# A system app's data is not cleared, so stopApp + launchApp instead of clearState.
appId: com.android.settings
---
- stopApp
- launchApp
- scrollUntilVisible:
    element:
      text: "(Display|Экран).*"
    direction: DOWN
- tapOn: "(Display|Экран).*"
- waitForAnimationToEnd
- takeScreenshot: "1-display"
